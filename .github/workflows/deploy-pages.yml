name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website files
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp CNAME index.html speaker-bios.html styles.css poster-theme.css app.js cardiotech_logo.png CardioTech_banner.png "$RUNNER_TEMP/site/"
          cp -R assets "$RUNNER_TEMP/site/assets"
          touch "$RUNNER_TEMP/site/.nojekyll"

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
